<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d1117">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0d1117; --surface:#151b23; --surface-2:#1e2630; --surface-3:#26303c; --line:#28313c;
  --ink:#e9eef4; --ink-2:#a9b4c1; --ink-3:#7c8896;
  --good:#22c55e; --good-ink:#4ade80; --good-bg:rgba(34,197,94,.15);
  --bad:#ef4444; --bad-ink:#f87171; --bad-bg:rgba(239,68,68,.15);
  --warn:#f59e0b; --warn-ink:#fbbf24; --warn-bg:rgba(245,158,11,.15);
  --none:#64748b; --none-bg:rgba(100,116,139,.18);
  --accent:#3b82f6; --accent-ink:#60a5fa; --accent-bg:rgba(59,130,246,.15); --series:#60a5fa;
  --radius:16px; --nav-h:64px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f1f3f6; --surface-3:#e6e9ee; --line:#e3e6eb;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#64748b;
  --good:#16a34a; --good-ink:#15803d; --good-bg:#dcfce7;
  --bad:#dc2626; --bad-ink:#b91c1c; --bad-bg:#fee2e2;
  --warn:#d97706; --warn-ink:#b45309; --warn-bg:#fef3c7;
  --none:#94a3b8; --none-bg:#eef1f5;
  --accent:#2563eb; --accent-ink:#1d4ed8; --accent-bg:#dbeafe; --series:#2563eb;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(var(--nav-h) + 28px)}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 8px}
.top{display:flex;align-items:center;gap:10px}
.hello{flex:1;min-width:0}
.hello .k{font-size:12.5px;color:var(--ink-3)}
.hello h1{font-size:20px;margin:0;letter-spacing:-.01em}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.iconbtn:disabled{opacity:.6}
.sub{display:flex;align-items:center;gap:10px;margin-top:10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;flex:none}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:9px;color:var(--ink-2);font-weight:600;font-size:14px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.updated{font-size:12px;color:var(--ink-3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.ptr{height:0;overflow:hidden;text-align:center;font-size:13px;color:var(--ink-3);transition:height .15s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:12px 0}
.sect{font-size:13px;font-weight:600;color:var(--ink-2);margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sect a,.link{color:var(--accent-ink);font-weight:600;font-size:13px;text-decoration:none;background:none;border:0;padding:0}
.muted{color:var(--ink-2)} .small{font-size:13px} .tiny{font-size:12px;color:var(--ink-3)}
.up{color:var(--good-ink)} .down{color:var(--bad-ink)}
.num{font-variant-numeric:tabular-nums}
.banner{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13.5px}
.banner.demo{background:var(--warn-bg)} .banner.err{background:var(--bad-bg)} .banner.info{background:var(--accent-bg)}
/* market status */
.regime{display:flex;align-items:center;gap:12px;border-radius:var(--radius);padding:14px;margin:12px 0}
.regime.BULL{background:var(--good-bg)} .regime.BEAR{background:var(--bad-bg)} .regime.SIDEWAYS{background:var(--none-bg)} .regime.VOLATILE{background:var(--warn-bg)}
.regime .k{font-size:12px;color:var(--ink-2)}
.regime .v{font-size:17px;font-weight:700}
.regime.BULL .v{color:var(--good-ink)} .regime.BEAR .v{color:var(--bad-ink)} .regime.VOLATILE .v{color:var(--warn-ink)}
.regime .ic{width:40px;height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.regime .adv{font-size:12.5px;color:var(--ink-2);margin-top:2px}
/* signal label chips */
.lab{display:inline-flex;align-items:center;gap:4px;border-radius:8px;padding:4px 9px;font-weight:700;font-size:12.5px;white-space:nowrap}
.lab.STRONG_BUY{background:var(--good);color:#04150a} .lab.BUY{background:var(--good-bg);color:var(--good-ink)}
.lab.HOLD{background:var(--none-bg);color:var(--ink-2)}
.lab.SELL{background:var(--bad-bg);color:var(--bad-ink)} .lab.STRONG_SELL{background:var(--bad);color:#fff}
.lab.open{background:var(--accent-bg);color:var(--accent-ink)} .lab.good{background:var(--good-bg);color:var(--good-ink)} .lab.bad{background:var(--bad-bg);color:var(--bad-ink)}
/* top signal */
.top-sig .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.top-sig .sym{font-size:20px;font-weight:750}
.mini{display:block;width:100%;height:76px;margin:10px 0 6px}
.scorebar{position:relative;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.scorebar i{position:absolute;top:0;bottom:0}
.scorebar b{position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--ink-3)}
.scorehead{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin:8px 0 5px}
.scorehead .s{font-weight:800;font-size:14px}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.fchip{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--none-bg);color:var(--ink-2)}
.fchip.ok{background:var(--good-bg);color:var(--good-ink)} .fchip.no{background:var(--bad-bg);color:var(--bad-ink)}
.kv2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv{background:var(--surface-2);border-radius:12px;padding:9px 10px;min-width:0}
.kv .k{font-size:11.5px;color:var(--ink-3)} .kv .v{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:650;background:var(--surface-2);min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#04150a}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:8px;margin-top:12px}
.btns .btn{flex:1}
/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:58px}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row .nm{flex:1;min-width:0}
.row .nm b{font-size:15px}
.row .nm .tiny{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .px{text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
.row .lab{min-width:82px;justify-content:center}
.spark{display:block;flex:none}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.newcard{flex:none;width:150px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink-2);white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.wl .chip button{border:0;background:none;color:var(--ink-3);padding:0 0 0 6px}
.wl input{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;width:120px;font-size:13px;text-transform:uppercase}
.empty{text-align:center;color:var(--ink-2);padding:26px 10px}
.term{border-bottom:1px dotted var(--ink-3);cursor:help}
/* chart */
.chartwrap{position:relative;height:330px;margin:0 -4px}
.chartlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:8px 2px}
.chartlegend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:3px;margin-right:4px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex}
nav.bottom button{flex:1;border:0;background:none;color:var(--ink-3);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.bottom button svg{width:23px;height:23px}
nav.bottom button.on{color:var(--accent-ink)}
nav.bottom .badge{position:absolute;margin:-30px 0 0 22px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;padding:0 4px}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none}
.overlay.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:92vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:none}
.sheet.on{display:block;animation:up .2s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{left:50%;width:620px;margin-left:-310px;bottom:auto;top:5vh;border-radius:20px;max-height:90vh}}
.sheet h2{margin:0;font-size:22px}
.close{float:right;border:0;background:var(--surface-2);border-radius:999px;width:36px;height:36px;font-size:17px;color:var(--ink-2)}
.verdict{border-radius:14px;padding:12px 14px;margin:12px 0;background:var(--surface-2)}
.verdict.buy{background:var(--good-bg)} .verdict.sell{background:var(--bad-bg)}
.verdict .v{font-size:20px;font-weight:800}
h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);margin:20px 0 8px}
.factor{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px solid var(--line)}
.factor:last-child{border-bottom:0}
.factor .pts{font-weight:750;font-variant-numeric:tabular-nums;text-align:right}
.factor .fb{grid-column:1/-1;height:5px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden;margin-top:3px}
.factor .fb i{position:absolute;top:0;bottom:0}
.check{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .ic{width:20px;text-align:center}
.bar{display:flex;height:20px;border-radius:6px;overflow:hidden;gap:2px}
.bar div{height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;font-size:12.5px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.warnbox{background:var(--warn-bg);border-radius:12px;padding:9px 12px;margin:8px 0;font-size:13.5px}
details{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
summary{cursor:pointer;font-size:13px;font-weight:650;color:var(--ink-2);padding:10px 0}
.foot{font-size:12px;color:var(--ink-3);margin-top:14px}
/* journal + stats */
.range{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--bad) 0,var(--none) 50%,var(--good) 100%);opacity:.8;margin:10px 0 4px}
.range i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.rangelbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.tile .k{font-size:12px;color:var(--ink-2)} .tile .v{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)} th{color:var(--ink-3);font-weight:600;font-size:11.5px}
td.r,th.r{text-align:right}
.chartbox{position:relative}
.tt{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:8px;padding:5px 8px;font-size:12px;white-space:nowrap;display:none;transform:translate(-50%,-110%)}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
.field input,.field select{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 11px}
.frow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.tg{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--surface-3);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tg:checked{background:var(--good)} .tg:checked::after{left:21px}
.tip{position:fixed;z-index:60;max-width:300px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tip b{display:block;margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:70;display:none;font-size:14px;max-width:90vw}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--ink-3);border-top-color:var(--accent-ink);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.runlbl{font-size:12px;color:var(--accent-ink);font-weight:600}
body.locked nav.bottom,body.locked #refresh,body.locked #bell,body.locked .sub{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="hello"><div class="k" id="greet">Stock Scanner</div><h1 id="title">Scanner</h1></div>
      <button class="iconbtn" id="bell" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button class="iconbtn" id="refresh" aria-label="Run a new scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
    <div class="sub"><div class="seg" id="mkt"></div><div class="updated" id="updated">Loading…</div></div>
  </header>
  <div class="ptr" id="ptr">Pull to load the latest results</div>
  <div id="banners"></div>
  <section id="view-home"></section>
  <section id="view-scanner" hidden></section>
  <section id="view-chart" hidden></section>
  <section id="view-journal" hidden></section>
  <section id="view-stats" hidden></section>
</div>
<nav class="bottom" id="nav">
  <button data-view="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg>Home</button>
  <button data-view="scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 19 5"/></svg>Scanner</button>
  <button data-view="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M12 3v18M18 6v14"/><rect x="4" y="8" width="4" height="7" rx="1"/><rect x="10" y="6" width="4" height="9" rx="1"/><rect x="16" y="10" width="4" height="6" rx="1"/></svg>Chart</button>
  <button data-view="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2z"/><path d="M5 17a2 2 0 0 1 2-2h12"/><path d="M9 7h6M9 11h4"/></svg>Journal<span class="badge" id="jbadge" hidden></span></button>
  <button data-view="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Stats</button>
</nav>
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
// ============================================================ storage
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast("Couldn't save on this phone (storage blocked)."); } },
};
function guessRepo(){
  const h = location.hostname;
  if (h.endsWith(".github.io")){
    const owner = h.split(".")[0], seg = location.pathname.split("/").filter(Boolean)[0];
    return owner + "/" + (seg || h);
  }
  return "";
}
let CFG = null, RES = {}, STATUS = null;
let market = LS.get("ss_market", "PSX");
let GH = LS.get("ss_github", {repo: "", token: "", branch: "main"});
let filter = "all", showNone = false, openSym = null, resetArmed = false, busy = false, runInfo = null;

// ============================================================ helpers
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const term = (k, text) => `<span class="term" data-term="${k}">${text}</span>`;
const today = () => new Date().toLocaleDateString("en-CA");
function M(){ return CFG ? CFG.markets[market] : null; }
function cur(){ return M() ? M().currency : ""; }
function settings(){
  const m = M(), s = LS.get("ss_settings_" + market, {});
  return {budget: +(s.budget || m.budget), max_loss: +(s.max_loss || m.max_loss_per_trade)};
}
function mcfg(){ const st = settings(); return Object.assign({}, M(), {budget: st.budget, max_loss_per_trade: st.max_loss}); }
function money(x, signed){
  if (x == null || isNaN(x)) return "–";
  const a = Math.abs(x), dp = a >= 1000 ? 0 : 2;
  const s = a.toLocaleString(undefined, {minimumFractionDigits: dp, maximumFractionDigits: dp});
  return (signed ? (x > 0 ? "+" : x < 0 ? "−" : "") : (x < 0 ? "−" : "")) + cur() + " " + s;
}
function num(x, dp=2){ return x == null ? "–" : Number(x).toLocaleString(undefined,{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function pct(x){ return x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(2) + "%"; }
function cls(x){ return x > 0 ? "up" : x < 0 ? "down" : ""; }
function toast(msg, ms){ const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(()=> t.style.display="none", ms || 3800); }
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(s.replace(/\n/g, ""))));

// ============================================================ money maths (same as the Python scanner)
function feeRate(f){ const comm = (f.commission_pct||0)/100; return comm + comm*(f.tax_on_commission_pct||0)/100 + (f.other_pct||0)/100; }
function sizePosition(entry, stop, m, cash){
  const fr = feeRate(m.fees), lot = Math.max(1, m.lot_size || 1);
  const lossPer = (entry - stop) + fr * (entry + stop);
  if (lossPer <= 0) return 0;
  const byRisk = m.max_loss_per_trade / lossPer;
  const byCash = Math.min(cash, m.budget * m.max_position_pct / 100) / (entry * (1 + fr));
  return Math.max(0, Math.floor(Math.min(byRisk, byCash) / lot) * lot);
}
function tradeMoney(sh, entry, exit, m){
  const fr = feeRate(m.fees), bf = sh*entry*fr, sf = sh*exit*fr, pre = sh*(exit-entry) - bf - sf;
  const tax = Math.max(0, pre) * (m.fees.cgt_pct || 0) / 100;
  return {fees: bf + sf, buy_fees: bf, sell_fees: sf, tax, net: pre - tax};
}
function planFor(p){
  const m = mcfg(), L = p.levels, cash = practice().cash;
  const shares = sizePosition(L.entry, L.stop, m, cash);
  if (shares <= 0) return null;
  const win = tradeMoney(shares, L.entry, L.target, m), lose = tradeMoney(shares, L.entry, L.stop, m);
  return {shares, entry: L.entry, stop: L.stop, target: L.target, cost: shares*L.entry,
          risk_money: -lose.net, reward_money: win.net, fees_round_trip: win.fees, tax_if_win: win.tax,
          hold_days: CFG.rules.max_hold_days};
}

// ============================================================ practice account (saved on this phone)
function practice(){
  const a = LS.get("ss_practice_" + market, null);
  if (a) return a;
  const b = settings().budget;
  return {start_cash: b, cash: b, positions: [], closed: [], equity: []};
}
function savePractice(a){ LS.set("ss_practice_" + market, a); }
function priceMap(){ const r = RES[market]; const o = {}; (r ? r.picks : []).forEach(p => o[p.symbol] = p.price); return o; }
function recordEquity(a){
  const pr = priceMap();
  a.positions.forEach(p => { if (pr[p.symbol] != null) p.last = pr[p.symbol]; });
  const eq = a.cash + a.positions.reduce((s, p) => s + p.shares * (p.last ?? p.entry), 0);
  const d = today();
  a.equity = a.equity.filter(e => e.d !== d).concat([{d, v: Math.round(eq*100)/100}]).slice(-400);
}
function positionSignal(pos, price){
  const held = Math.round((new Date(today()) - new Date(pos.date)) / 864e5), maxd = CFG.rules.max_hold_days;
  if (price <= pos.stop) return ["SELL", `Price is at or below your stop (${num(pos.stop)}). Sell to keep the loss small.`, held];
  if (price >= pos.target) return ["SELL", `Target reached (${num(pos.target)}). Take the profit.`, held];
  if (held >= Math.floor(maxd * 7 / 5)) return ["SELL", `Held for ${held} days, past your ${maxd}-trading-day limit.`, held];
  return ["HOLD", `Between your stop (${num(pos.stop)}) and target (${num(pos.target)}). Keep holding.`, held];
}
function buy(sym){
  const a = practice(), p = (RES[market]?.picks || []).find(x => x.symbol === sym);
  if (!p) return toast("Refresh first: no data for " + sym);
  if (a.positions.some(x => x.symbol === sym)) return toast("You already hold " + sym + " in practice.");
  const pl = planFor(p); if (!pl) return toast("No position size fits your budget and max loss for " + sym + ".");
  const fees = pl.cost * feeRate(M().fees);
  a.cash = Math.round((a.cash - pl.cost - fees) * 100) / 100;
  a.positions.push({symbol: sym, shares: pl.shares, entry: pl.entry, stop: pl.stop, target: pl.target, date: today(),
                    buy_fees: fees, signal_at_entry: p.label || p.signal, reason: p.reason, last: pl.entry});
  recordEquity(a); savePractice(a); render(); toast("Practice buy recorded: " + pl.shares + " " + sym);
}
function sell(sym, why){
  const a = practice(), pos = a.positions.find(x => x.symbol === sym);
  if (!pos) return toast("You don't hold " + sym + ".");
  const price = priceMap()[sym] ?? pos.last ?? pos.entry, m = mcfg(), t = tradeMoney(pos.shares, pos.entry, price, m);
  a.cash = Math.round((a.cash + pos.shares*price - t.sell_fees - t.tax) * 100) / 100;
  a.positions = a.positions.filter(x => x !== pos);
  a.closed.push({symbol: sym, shares: pos.shares, entry: pos.entry, exit: price, opened: pos.date, closed: today(),
                 fees: t.fees, tax: t.tax, net: Math.round(t.net*100)/100, pct: Math.round(10000*t.net/(pos.shares*pos.entry))/100,
                 result: t.net > 0 ? "win" : "loss", entry_reason: pos.reason || "", exit_reason: why || "Sold from the dashboard"});
  recordEquity(a); savePractice(a); render(); toast("Practice sell recorded: " + sym);
}
function practiceView(){
  const a = practice(), pr = priceMap(), m = mcfg();
  let value = 0;
  const positions = a.positions.map(p => {
    const price = pr[p.symbol] ?? p.last ?? p.entry, t = tradeMoney(p.shares, p.entry, price, m);
    const [sig, why, days] = positionSignal(p, price); value += p.shares * price;
    return Object.assign({}, p, {price, pnl: t.net, pnl_pct: 100*t.net/(p.shares*p.entry), signal: sig, why, days});
  });
  const c = a.closed, wins = c.filter(t => t.net > 0).map(t => t.net), losses = c.filter(t => t.net <= 0).map(t => t.net);
  const avg = xs => xs.length ? xs.reduce((s,x)=>s+x,0)/xs.length : null;
  return {start_cash: a.start_cash, cash: a.cash, equity_now: a.cash + value, total_pnl: a.cash + value - a.start_cash,
          positions, closed: c.slice().reverse().slice(0, 100), equity: a.equity,
          stats: {trades: c.length, wins: wins.length, losses: losses.length,
                  win_rate: c.length ? Math.round(1000*wins.length/c.length)/10 : null,
                  avg_win: avg(wins), avg_loss: avg(losses)}};
}

// ============================================================ GitHub
function ghHeaders(raw){ return {Authorization: "Bearer " + GH.token, Accept: raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}; }
async function gh(path, opt){
  const r = await fetch("https://api.github.com/repos/" + GH.repo + path, Object.assign({cache: "no-store"}, opt || {}));
  if (r.status === 401) throw new Error("GitHub key is wrong or expired. Update it in Stats → Settings.");
  if (r.status === 403 || r.status === 404) throw new Error("GitHub key can't reach " + GH.repo + " (check the repository name and the key's permissions).");
  if (!r.ok && r.status !== 204) throw new Error("GitHub error " + r.status);
  return r;
}
async function getJSON(repoPath){
  const r = await fetch("https://api.github.com/repos/" + GH.repo + "/contents/" + repoPath + "?ref=" + encodeURIComponent(GH.branch || "main"),
                        {cache: "no-store", headers: ghHeaders(true)});
  if (r.status === 404) return null;
  if (r.status === 401) throw new Error("Your GitHub key is wrong or expired. Connect again below.");
  if (!r.ok) throw new Error("GitHub error " + r.status);
  return await r.json();
}
async function connect(repo, token){
  const r = await fetch("https://api.github.com/repos/" + repo, {headers: {Authorization: "Bearer " + token, Accept: "application/vnd.github+json"}});
  if (r.status === 401) throw new Error("That key isn't valid. Copy it again from GitHub.");
  if (!r.ok) throw new Error("Can't see " + repo + " with that key. Check the name and that the key includes this repository.");
  const j = await r.json();
  GH = {repo, token, branch: j.default_branch || "main"}; LS.set("ss_github", GH);
}
async function editConfig(fn, message){
  const r = await gh("/contents/config.json?ref=" + encodeURIComponent(GH.branch), {headers: ghHeaders(false)});
  const j = await r.json(), cfg = JSON.parse(b64dec(j.content));
  fn(cfg);
  await gh("/contents/config.json", {method: "PUT", headers: Object.assign(ghHeaders(false), {"Content-Type": "application/json"}),
    body: JSON.stringify({message, content: b64enc(JSON.stringify(cfg, null, 2) + "\n"), sha: j.sha, branch: GH.branch})});
  CFG.markets = cfg.markets; CFG.rules = cfg.rules;
}

async function loadAll(){
  if (!GH.token || !GH.repo){ welcome(); return; }
  const [cfg, psx, us, st, lp, lu] = await Promise.all([
    getJSON("config.json"), getJSON("docs/data/results_PSX.json"), getJSON("docs/data/results_US.json"),
    getJSON("docs/data/status.json"), getJSON("docs/data/signals_PSX.json"), getJSON("docs/data/signals_US.json"),
  ]);
  if (!cfg) throw new Error("config.json not found in " + GH.repo + ".");
  document.body.classList.remove("locked");
  CFG = cfg; RES = {PSX: psx, US: us}; STATUS = st; SIGLOG = {PSX: lp, US: lu}; CHARTS = {};
  if (!CFG.markets[market]) market = "PSX";
  const a = practice(); if (RES[market]){ recordEquity(a); savePractice(a); }
  render();
}
async function loadCharts(mk){
  if (CHARTS[mk] !== undefined) return CHARTS[mk];
  const j = await getJSON("docs/data/charts_" + mk + ".json");
  CHARTS[mk] = j ? j.charts : null;
  return CHARTS[mk];
}
function setRunLabel(s){ $("updated").innerHTML = s ? `<span class="runlbl">${esc(s)}</span>` : updatedText(); }
async function dispatchScan(inputs){
  await gh("/actions/workflows/scan.yml/dispatches", {method: "POST", headers: Object.assign(ghHeaders(false), {"Content-Type": "application/json"}),
    body: JSON.stringify({ref: GH.branch, inputs})});
}
async function refresh(){
  if (busy) return;
  const b = $("refresh");
  if (!GH.token){ welcome(); return; }
  busy = true; b.disabled = true; b.innerHTML = `<span class="spin"></span>`;
  const t0 = Date.now(), held = practice().positions.map(p => p.symbol);
  const label = s => { const sec = Math.round((Date.now() - t0) / 1000); setRunLabel(`${s} ${market} · ${Math.floor(sec/60)}:${String(sec%60).padStart(2,"0")}`); };
  try {
    label("Starting");
    await dispatchScan({market, extra: held.join(",")});
    let run = null;
    while (Date.now() - t0 < 8 * 60 * 1000){
      await new Promise(r => setTimeout(r, 5000));
      const r = await gh("/actions/workflows/scan.yml/runs?event=workflow_dispatch&per_page=5", {headers: ghHeaders(false)});
      const runs = (await r.json()).workflow_runs || [];
      run = runs.find(x => new Date(x.created_at).getTime() >= t0 - 90000) || run;
      if (!run){ label("Starting"); continue; }
      if (run.status !== "completed"){ label(run.status === "queued" ? "Queued" : "Scanning"); continue; }
      break;
    }
    if (!run || run.status !== "completed") throw new Error("The scan is taking longer than usual. Pull down in a minute to load it.");
    runInfo = run.html_url;
    if (run.conclusion !== "success") throw new Error("The scan failed on GitHub. Stats → Settings → Last scan log.");
    await loadAll(); toast("Scan finished");
  } catch(e){ toast(e.message, 6000); render(); }
  busy = false; b.disabled = false;
  b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>`;
  setRunLabel("");
}

const GLOSSARY = {
  score: ["Signal score", "−100 to +100. Seven factors each add or take away points: trend 25, momentum 20, volume 15, price levels 15, relative strength 10, timeframes 10, market match 5. +70 or more is a Strong buy, −70 or less a Strong sell (stricter when the signal goes against the market)."],
  regime: ["Market status", "Read from the index (KSE-100, or the average of the large stocks the scanner tracks; S&P 500 for US). Bull = above its 50- and 200-day averages and trending. Bear = below them and trending. Sideways = no clear trend. High volatility = daily moves much bigger than usual."],
  trend: ["Trend", "Is the price above its 20, 50 and 200-day averages, and are the averages stacked in order? Up to 25 points."],
  momentum: ["Momentum", "RSI zone (55–70 is healthy, over 80 overbought, under 45 weak) and whether the MACD is above zero and rising. Up to 20 points."],
  volume: ["Volume", "Today's volume compared with a normal day. A big-volume up day adds points; a big-volume down day takes them away. Up to 15 points."],
  levels: ["Price levels", "Breaking above the 20-day high (breakout) or below the 20-day low (breakdown); bouncing off support or stalling under resistance. Up to 15 points."],
  rs: ["Relative strength", "The stock's last 20 days compared with the market's. Stronger than the market earns points. Up to 10 points."],
  mtf: ["Multi-timeframe", "Do the last week and the 50-day trend point the same way? Up to 10 points."],
  market: ["Market match", "Bull market +5, bear market −5. Buys in a falling market are the biggest source of losing signals."],
  rr: ["Risk : reward (net)", "What you'd make at the target compared with what you'd lose at the stop, after fees and tax. On price alone the target is always 2× the risk; fees and capital gains tax bring the net figure down, most on stocks with a tight stop."],
  stop: ["Stop-loss", "The price where you sell to cut a loss: 1.5× the stock's typical daily move below the buy price. Decide it before you buy and never move it lower."],
  target: ["Target", "The price where you sell to take profit: 2× the distance from the buy price to the stop."],
  shares: ["Number of shares", "Sized so that, if the stop is hit, you lose about your 'max loss per trade' (fees included), and never more than 40% of your budget goes into one stock."],
  fees: ["Fees", "Broker commission, tax on that commission and exchange charges, on both the buy and the sell. The rates are in config.json in your GitHub repository."],
  cgt: ["Capital gains tax", "Tax on profit when you sell. The default for PSX is 15%; check your own rate (filer / non-filer)."],
  sim: ["Simulator", "Shuffles this stock's own daily moves from the last year into 10,000 possible futures for the next 10 trading days and counts how many hit the target first, the stop first, or neither."],
  backtest: ["Back-test", "Every past day in the last ~2 years when a stock in your list first got this label, with the same stop and target rules: did the target (or, for sells, the matching fall) come first? 'Avg R' is the average result in units of risk: +0.3 means you'd make 0.3× your risk per signal on average."],
  siglog: ["Live signal record", "Every Buy, Strong buy, Sell and Strong sell the scanner has given since this feature started, checked on later scans. Right = target reached (or, for sells, the price fell), or it ended ahead after the holding days. This is the honest scorecard: watch it for a few weeks."],
  setup: ["Setup checklist", "The original 5-check rules: breakout or oversold bounce, volume, market above its 20-day average, liquidity and the simulator's odds. Shown for comparison with the score."],
  practice: ["Practice trade", "Pretend money, real prices, saved on this phone. Your Journal and Stats show whether the signals work for you before you risk real money."],
  limit: ["Price limit", "PSX stops a stock moving more than 10% (or Re 1) in a day. Near the limit, it can lock and you may not be able to buy or sell."],
  hold: ["Hold / Sell", "For practice trades: SELL when the stop or target is reached or you've held past your time limit; otherwise HOLD."],
  winrate: ["Win rate", "The share of your closed practice trades that made money after fees and tax. A 40% win rate can still be profitable if wins are twice the size of losses."],

// ============================================================ small drawing helpers
function scoreBar(s){
  const w = Math.abs(s) / 2, col = s >= 0 ? "var(--good)" : "var(--bad)";
  return `<div class="scorebar" role="img" aria-label="Score ${s}"><i style="${s >= 0 ? "left:50%" : `left:${50 - w}%`};width:${w}%;background:${col}"></i><b></b></div>`;
}
function scoreHead(p){
  const ch = p.score_change;
  return `<div class="scorehead"><span>${term("score","Signal score")}${ch ? ` <span class="tiny">(${ch > 0 ? "+" : ""}${ch} since last scan)</span>` : ""}</span><span class="s ${p.score > 0 ? "up" : p.score < 0 ? "down" : ""}">${p.score > 0 ? "+" : ""}${p.score}</span></div>`;
}
function miniCandles(rows, h){
  if (!rows || rows.length < 2) return "";
  h = h || 76;
  const W = 330, pad = 4, lo = Math.min(...rows.map(r => r[2])), hi = Math.max(...rows.map(r => r[1])), sp = (hi - lo) || 1;
  const y = v => (pad + (h - 2*pad) * (1 - (v - lo) / sp)).toFixed(1), step = W / rows.length, bw = Math.max(3, step * 0.55);
  return `<svg class="mini" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true">` + rows.map((r, i) => {
    const x = step * i + step / 2, up = r[3] >= r[0], c = up ? "var(--good)" : "var(--bad)";
    const top = y(Math.max(r[0], r[3])), bot = y(Math.min(r[0], r[3]));
    return `<line x1="${x}" x2="${x}" y1="${y(r[1])}" y2="${y(r[2])}" stroke="${c}" stroke-width="1"/><rect x="${(x - bw/2).toFixed(1)}" y="${top}" width="${bw.toFixed(1)}" height="${Math.max(1, bot - top).toFixed(1)}" fill="${c}" rx="1"/>`;
  }).join("") + `</svg>`;
}
function spark(vals, w=64, h=26){
  if (!vals || vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), sp = (hi - lo) || 1, up = vals[vals.length-1] >= vals[0];
  const pts = vals.map((v,i) => `${(i*(w-2)/(vals.length-1)+1).toFixed(1)},${(h-2-(v-lo)/sp*(h-4)).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up ? "var(--good)" : "var(--bad)"}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function fchips(p, max){
  return `<div class="fchips">` + (p.factors || []).filter(f => f.ok !== null).slice(0, max || 7)
    .map(f => `<span class="fchip ${f.ok ? "ok" : "no"}">${esc(f.short)} ${f.ok ? "✓" : "✗"}</span>`).join("") + `</div>`;
}
function rrText(pl){ return pl && pl.risk_money > 0 ? "1 : " + (pl.reward_money / pl.risk_money).toFixed(1) : "–"; }
function updatedText(){
  const r = RES[market];
  if (!r) return `No ${market} scan yet`;
  const d = new Date(r.updated), mins = Math.round((Date.now() - d) / 60000);
  const ago = mins < 60 ? mins + " min ago" : mins < 1440 ? Math.round(mins/60) + " h ago" : d.toLocaleDateString();
  return `Scanned ${ago} · prices ${esc(r.mood ? r.mood.date : (r.picks[0]||{}).date || "–")}`;
}
function pickRow(p){
  return `<div class="row" data-sym="${esc(p.symbol)}"><div class="nm"><b>${esc(p.symbol)}</b>${p.watch ? " <span class='tiny'>★</span>" : ""}

    ${spark(p.spark)}

    <span class="lab ${p.label}">${p.score > 0 ? "+" : ""}${p.score}</span></div>`;

// ============================================================ render
function render(){
  if (!CFG) return;
  const r = RES[market], m = M(), wl = m.watchlist;
  if (r) r.picks.forEach(p => p.watch = wl.includes(p.symbol));
  $("mkt").innerHTML = Object.keys(CFG.markets).map(k => `<button class="${k===market?"on":""}" data-mkt="${k}">${k === "PSX" ? "🇵🇰 PSX" : "🇺🇸 US"}</button>`).join("");
  if (!busy) $("updated").innerHTML = updatedText();
  const hr = new Date().getHours();
  $("greet").textContent = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  $("bell").innerHTML = $("bell").innerHTML.replace(/<span class="dot"><\/span>/, "") + (PUSH.on ? `<span class="dot"></span>` : "");
  let b = "";
  if (r && r.source === "demo") b += `<div class="banner demo">⚠️ <b>Demo data.</b> These prices are made up for testing.</div>`;
  if (r && r.stale) b += `<div class="banner err">⚠️ <b>This is the previous scan.</b> The last scan couldn't download new ${esc(market)} prices.${runInfo ? ` <a href="${esc(runInfo)}" target="_blank" rel="noopener">See the log</a>` : ""}</div>`;
  else if (r && r.errors && r.errors.length) b += `<div class="banner err"><b>Couldn't load ${r.errors.length}:</b> ${esc(r.errors.slice(0,4).join(" · "))}${r.errors.length>4?" …":""}</div>`;
  if (r && r.picks.length && r.picks[0].score === undefined) b += `<div class="banner info">This scan is from before the signal-score update. Tap ↻ to run a new scan.</div>`;
  $("banners").innerHTML = b;
  const sells = practiceView().positions.filter(p => p.signal === "SELL").length;
  $("jbadge").hidden = !sells; $("jbadge").textContent = sells;
  showView(view, true);
  if (openSym) openPick(openSym);
}
function showView(v, quiet){

  ["home","scanner","chart","journal","stats"].forEach(k => $("view-" + k).hidden = k !== v);
  $("title").textContent = {home: "Scanner", scanner: "All signals", chart: "Chart", journal: "Journal", stats: "Stats"}[v];
  ({home: renderHome, scanner: renderScanner, chart: renderChart, journal: renderJournal, stats: renderStats})[v]();
  if (!quiet) window.scrollTo(0, 0);
}
function regimeCard(){
  const r = RES[market], g = r && r.regime, md = r && r.mood;
  if (!g) return `<div class="regime SIDEWAYS"><div class="ic">⚪</div><div><div class="k">${term("regime","Market status")}</div><div class="v">Waiting for the next scan</div></div></div>`;
  const nm = md && md.basket ? (market + " market") : (md ? md.name : "");

function loadLWC(){
  if (window.LightweightCharts) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "lightweight-charts.js";
    s.onload = res; s.onerror = () => rej(new Error("Couldn't load the chart. Check your internet.")); document.head.appendChild(s); });
}
function scoreLine(scores, dates){
  const pts = scores.map((s, i) => [i, s]).filter(x => x[1] != null);
  if (pts.length < 2) return "";
  const W = 340, H = 90, y = v => (H/2 - v / 100 * (H/2 - 6)).toFixed(1), x = i => (i * (W - 4) / (scores.length - 1) + 2).toFixed(1);
  const band = (v, c) => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${c}" stroke-dasharray="3 4" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="Signal score over time">
    ${band(70,"var(--good)")}${band(40,"var(--good)")}${band(0,"var(--line)")}${band(-40,"var(--bad)")}${band(-70,"var(--bad)")}
    <polyline points="${pts.map(p => x(p[0]) + "," + y(p[1])).join(" ")}" fill="none" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linejoin="round"/></svg>
    <div class="rangelbl"><span>${esc(dates[0])}</span><span>dashed lines: ±40 Buy/Sell · ±70 Strong</span><span>${esc(dates[dates.length-1])}</span></div>`;
}

const RIGHT = ["win", "expired_good", "flipped_good"], WRONG = ["loss", "expired_bad", "flipped_bad"];
function statusChip(s){
  if (s === "open") return `<span class="lab open">Open</span>`;
  if (RIGHT.includes(s)) return `<span class="lab good">${s === "win" ? "Hit target" : "Right"}</span>`;
  return `<span class="lab bad">${s === "loss" ? "Hit stop" : "Wrong"}</span>`;
}
function liveStats(){
  const es = ((SIGLOG[market] || {}).entries || []);
  const rows = ["STRONG_BUY", "BUY", "SELL", "STRONG_SELL"].map(l => {
    const x = es.filter(e => e.label === l), closed = x.filter(e => e.status !== "open"), right = closed.filter(e => RIGHT.includes(e.status)).length;
    return {l, n: x.length, open: x.length - closed.length, closed: closed.length, right, rate: closed.length ? Math.round(100 * right / closed.length) : null};
  });
  return {es, rows};
}
function equityChart(pts, start){
  if (pts.length < 2) return `<div class="tiny" style="margin-top:6px">The chart appears after a second day of scans or trades.</div>`;
  const W = 640, H = 190, L = 8, R = 8, T = 12, B = 22;
  const vals = pts.map(p => p.v), lo = Math.min(...vals, start), hi = Math.max(...vals, start), pad = (hi - lo) * 0.1 || hi * 0.01;
  const y = v => T + (H - T - B) * (1 - (v - (lo - pad)) / ((hi + pad) - (lo - pad)));
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const d = pts.map((p,i) => `${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(""), ys = y(start);
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Practice balance over time">
    <line x1="${L}" x2="${W-R}" y1="${ys}" y2="${ys}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${W-R}" y="${ys-4}" text-anchor="end" font-size="12" fill="var(--ink-3)">start ${money(start)}</text>
    <path d="${d}" fill="none" stroke="var(--series)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${L}" y="${H-6}" font-size="12" fill="var(--ink-3)">${esc(pts[0].d)}</text><text x="${W-R}" y="${H-6}" font-size="12" fill="var(--ink-3)" text-anchor="end">${esc(pts[pts.length-1].d)}</text></svg></div>`;
}

// ============================================================ push notifications
function urlB64(s){ const p = "=".repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, "+").replace(/_/g, "/")); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function subsFile(){
  const r = await fetch("https://api.github.com/repos/" + GH.repo + "/contents/push/subscriptions.json?ref=" + encodeURIComponent(GH.branch), {cache: "no-store", headers: ghHeaders(false)});
  if (r.status === 404) return {data: {subs: []}, sha: null};
  if (!r.ok) throw new Error("Couldn't read your notification settings on GitHub (error " + r.status + ").");
  const j = await r.json();
  return {data: JSON.parse(b64dec(j.content)), sha: j.sha};
}
async function saveSubs(fn, message){
  for (let i = 0; i < 2; i++){
    const {data, sha} = await subsFile();
    fn(data);
    const r = await fetch("https://api.github.com/repos/" + GH.repo + "/contents/push/subscriptions.json", {method: "PUT",
      headers: Object.assign(ghHeaders(false), {"Content-Type": "application/json"}),
      body: JSON.stringify(Object.assign({message, content: b64enc(JSON.stringify(data, null, 1) + "\n"), branch: GH.branch}, sha ? {sha} : {}))});
    if (r.ok) return;
    if (r.status !== 409) throw new Error("Couldn't save notification settings on GitHub (error " + r.status + "). Your key needs Contents: read and write.");
  }
  throw new Error("GitHub was busy saving. Try again.");
}
async function swReg(){ return navigator.serviceWorker.register("sw.js"); }
async function pushSync(){
  const reg = await swReg(); await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: urlB64(CFG.push.vapid_public_key)});
  const j = sub.toJSON();
  await saveSubs(d => {
    d.subs = (d.subs || []).filter(x => x.endpoint !== j.endpoint);
    d.subs.push({endpoint: j.endpoint, keys: j.keys, levels: PUSH.levels, markets: PUSH.markets, watch_only: !!PUSH.watch_only,
                 device: (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "phone", updated: new Date().toISOString()});
  }, "Notification settings");
}
async function pushToggle(on){
  if (!GH.token) throw new Error("Connect GitHub first.");
  if (on){
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("Notifications are blocked. Allow them for this site in Chrome's site settings.");
    PUSH.on = true; await pushSync();
  } else {
    const reg = await navigator.serviceWorker.getRegistration(), sub = reg && await reg.pushManager.getSubscription();
    if (sub){ const ep = sub.endpoint; await sub.unsubscribe(); await saveSubs(d => { d.subs = (d.subs || []).filter(x => x.endpoint !== ep); }, "Notifications off"); }
    PUSH.on = false;
  }
  LS.set("ss_push", PUSH);
}
let pushBusy = false;
async function pushChange(fn, okMsg){
  if (pushBusy) return; pushBusy = true;
  try { await fn(); toast(okMsg); } catch(e){ toast(e.message, 6000); }
  pushBusy = false; LS.set("ss_push", PUSH); render();
}

  if (m && CFG && CFG.markets[m] && m !== market){ market = m; LS.set("ss_market", market); }
  if (CFG) render();
  if (s){ showView("home"); openPick(s.toUpperCase()); }
}
if ("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.open) openFromUrl(e.data.open); });
  if (location.protocol === "https:") swReg().catch(() => {});
}
loadAll().then(() => {
  if (location.search){ openFromUrl(location.href); history.replaceState(null, "", location.pathname); }
}).catch(e => welcome(e.message));
</script>
